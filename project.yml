name: Sudoku
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  SudokuPackage:
    path: .
targets:
  Sudoku:
    type: application
    platform: iOS
    sources: [App/Sources]
    dependencies:
      - package: SudokuPackage
        product: SudokuCore
      - package: SudokuPackage
        product: SudokuGame
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.sudoku
        PRODUCT_NAME: Sudoku
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Sudoku
